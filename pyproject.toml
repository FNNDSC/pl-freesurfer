[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "freesurfer"
dynamic = ["version"]
description = "FreeSurfer 8.2 recon-all over every subject directory of an input tree: a ChRIS DS plugin on pl-shexec"
readme = "README.rst"
license = { text = "MIT" }
# chris_plugin_info reads the legacy Author, Author-email and Home-page metadata
# fields, which the [project] table does not emit; setup.cfg supplies them, and the
# author name lives there alone so Author-email stays a bare address.
authors = [{ email = "dev@babyMRI.org" }]
requires-python = ">=3.11"
dependencies = ["chris_plugin>=0.4.0", "shexec>=2.2.0"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX",
]

[project.urls]
Homepage = "https://github.com/FNNDSC/pl-freesurfer"

[project.scripts]
freesurfer = "freesurfer.__main__:main"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools.packages.find]
include = ["freesurfer*"]

[tool.setuptools.dynamic]
version = { attr = "freesurfer.__version__" }

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
